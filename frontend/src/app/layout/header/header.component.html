<header class="header">
  <div class="header-left">
    <button
      class="menu-btn"
      type="button"
      (click)="onMenuToggle()"
      [attr.aria-label]="'layout.openMenu' | translate"
      data-cy="menu-toggle"
    >
      <svg
        class="menu-icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <span class="brand">CoFi</span>
  </div>

  <div class="header-right">
    <select
      class="lang-selector"
      [value]="translationService.currentLang()"
      (change)="onLangChange($event)"
      aria-label="Language"
    >
      <option value="en">EN</option>
      <option value="pt">PT</option>
    </select>

    <div class="user-menu-wrapper">
      <button
        class="avatar-btn"
        type="button"
        data-cy="user-menu-btn"
        [attr.aria-label]="'layout.userMenu.open' | translate"
        [attr.aria-expanded]="userMenuOpen()"
        (click)="toggleUserMenu($event)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="8" r="4" />
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
        </svg>
      </button>

      @if (userMenuOpen()) {
        <div class="user-dropdown" data-cy="user-dropdown" role="menu">
          <button
            class="logout-btn"
            type="button"
            data-cy="logout-btn"
            role="menuitem"
            (click)="onLogout()"
          >
            {{ 'layout.userMenu.logout' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
