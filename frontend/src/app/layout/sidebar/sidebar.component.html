<div
  class="overlay"
  [class.overlay--visible]="open()"
  (click)="close()"
  data-cy="sidebar-overlay"
  aria-hidden="true"
></div>

<nav class="sidebar" [class.sidebar--open]="open()" aria-label="Main navigation">
  @if (isAuthenticated()) {
    <app-private-nav-list (linkClicked)="close()" />
  } @else {
    <app-public-nav-list (linkClicked)="close()" />
  }
</nav>
