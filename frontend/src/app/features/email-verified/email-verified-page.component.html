<main class="email-verified">
  <div class="card">
    <div class="icon" aria-hidden="true">✓</div>
    <h1 data-cy="email-verified-title">{{ 'verification.emailVerified.title' | translate }}</h1>
    <p data-cy="email-verified-message">{{ 'verification.emailVerified.message' | translate }}</p>
    <button
      type="button"
      class="btn-primary"
      data-cy="email-verified-action"
      (click)="goToSignIn()"
    >
      {{ 'verification.emailVerified.action' | translate }}
    </button>
  </div>
</main>
