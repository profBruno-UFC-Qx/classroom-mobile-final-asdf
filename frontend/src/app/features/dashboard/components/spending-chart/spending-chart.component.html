<section class="chart" data-cy="spending-chart">
  <h3 class="chart__title">{{ 'dashboard.chart.title' | translate }}</h3>
  <div class="chart__container">
    <ngx-charts-bar-horizontal
      [results]="chartData"
      [scheme]="colorScheme"
      [xAxis]="true"
      [yAxis]="true"
      [showDataLabel]="true"
      [trimYAxisTicks]="false"
      [dataLabelFormatting]="dataLabelFormat()"
      [xAxisTickFormatting]="dataLabelFormat()">
    </ngx-charts-bar-horizontal>
  </div>
</section>
